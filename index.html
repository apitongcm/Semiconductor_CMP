<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMP Process Simulator</title>
<style>
:root{--ink:#e8eef6;--mu:#93a3b8;--ac:#38bdf8;--ok:#34d399;--bad:#f87171;--bd:#ffffff24;--gl:#0d141de6;--bg2:#ffffff0d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--ink:#0f1a28;--mu:#4d5d73;--ac:#0369a1;--ok:#047857;--bad:#b91c1c;--bd:#0f1a2830;--gl:#f8fafcf2;--bg2:#0f1a280d}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#090d13;color:var(--ink);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;z-index:5;color:#e8eef6;background:linear-gradient(#090d13e6,#090d1300)}
#top b{font-size:.74rem;letter-spacing:.16em;white-space:nowrap}#prog{flex:1;display:flex;gap:4px}#prog i{flex:1;height:3px;background:#ffffff2e}#prog i.on{background:#38bdf8}
#top button{background:none;border:1px solid #ffffff33;color:#cbd5e1;border-radius:6px;padding:3px 9px;font-size:.72rem;cursor:pointer;letter-spacing:.05em}
.lb{position:fixed;z-index:3;pointer-events:none;color:#e8eef6;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;border-left:1px solid #38bdf8;padding-left:6px;display:none;text-shadow:0 1px 4px #000}
#md{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#04070bb8;backdrop-filter:blur(5px);z-index:20;padding:12px}
#md.dock{align-items:flex-end;background:none;backdrop-filter:none;pointer-events:none;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.mc{pointer-events:auto;width:min(560px,100%);max-height:84dvh;overflow:auto;background:var(--gl);color:var(--ink);border:1px solid var(--bd);border-radius:12px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 20px 60px #0009}
.dock .mc{max-height:58dvh;padding:14px}
.mt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-bottom:8px}h3{margin:0 0 6px;font-size:1.15rem;font-weight:600}
p{margin:.45em 0}.mu{color:var(--mu)}.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
button.b{font:inherit;font-size:.85rem;border:1px solid var(--bd);background:var(--bg2);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;min-height:40px}
button.b.p{background:var(--ac);border-color:var(--ac);color:#04121c;font-weight:600}button.b:disabled{opacity:.4;cursor:default}button.hold{width:100%;font-size:1rem;padding:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.br{border-left:2px solid var(--ac);padding-left:10px;color:var(--mu);margin:.4em 0 .8em}
.learn{border:1px solid var(--bd);background:var(--bg2);border-radius:8px;padding:10px 14px;margin:10px 0}.learn ol{margin:.4em 0 .4em 1.1em;padding:0}.learn li{margin:.3em 0}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:4px;padding:0 7px;margin:2px 3px 2px 0;font-size:.72rem;color:var(--mu)}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}.gg{text-align:center}.gg svg{width:100%;max-width:140px}
.gt{fill:none;stroke:var(--bd);stroke-width:5}.gk{fill:none;stroke:var(--mu);stroke-width:8;stroke-dasharray:.8 7.2;opacity:.5}.gz{fill:none;stroke:var(--ok);stroke-width:5}.gn{stroke:var(--ink);stroke-width:2;stroke-linecap:round}.gc{fill:var(--ink)}
.gv{font:600 .85rem ui-monospace,Menlo,monospace}.gl{font-size:.64rem;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;line-height:1.25}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}.row label{min-width:110px;font-size:.8rem;color:var(--mu)}input[type=range]{flex:1;height:28px;accent-color:#38bdf8}
.bar{height:4px;background:var(--bd);border-radius:2px;overflow:hidden}.bar b{display:block;height:100%;background:var(--ac)}
canvas.cs{width:100%;border:1px solid var(--bd);border-radius:8px;background:#0a1018}.lg{font-size:.68rem;color:var(--mu);margin:4px 0}.lg i{display:inline-block;width:9px;height:9px;margin:0 4px 0 8px;vertical-align:middle}
.big{font:600 2rem ui-monospace,monospace}.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);left:50%;transform:translateX(-50%);background:#0d141def;border:1px solid #38bdf866;color:#e8eef6;padding:7px 14px;border-radius:6px;z-index:30;font-size:.8rem;white-space:nowrap}
</style></head><body>
<canvas id="gl"></canvas>
<div id="top"><b>CMP PROCESS SIMULATOR</b><div id="prog"></div><button id="sn">Sound on</button><button id="fs">Fullscreen</button></div>
<div id="md"><div class="mc"><div class="mt" id="mt"></div><div id="mb"></div><div class="mf" id="mf"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),NAMES=["Equipment","Slurry","Recipe","Planarization","Cleaning"];
const G={step:0,sc:[],sf:1,P:10,V:60,F:200,run:0,hu:100,hd:40,end:0,hl:-1,lab:[0,0,0,0],fr:40};
let snd=1,AC;const rate=()=>Math.max(0,10*(G.P/10)*(G.V/60)*G.sf*(G.F<120?.7:1));
function sfx(t){if(!snd)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime,f={ok:[520,780],bad:[220,150],ding:[880,1320],pop:[600,900]}[t];o.connect(g);g.connect(AC.destination);o.frequency.setValueAtTime(f[0],n);o.frequency.linearRampToValueAtTime(f[1],n+.15);g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.start();o.stop(n+.3)}catch(e){}}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}
$("sn").onclick=()=>{snd=!snd;$("sn").textContent=snd?"Sound on":"Sound off"};
$("fs").onclick=()=>{const e=document.documentElement;document.fullscreenElement?document.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen||(()=>toast("Fullscreen not supported on this device"))).call(e)};
/* modal + gauges */
function M(title,body,btns,dock){$("md").className=dock?"dock":"";$("md").style.display="flex";$("mt").textContent=title;$("mb").innerHTML=body;$("mf").innerHTML="";(btns||[]).forEach(b=>{const e=document.createElement("button");e.className="b"+(b[2]?" p":"");e.textContent=b[0];e.onclick=b[1];e.id=b[3]||"";$("mf").appendChild(e)})}
const gp=f=>[60-50*Math.cos(Math.PI*f),64-50*Math.sin(Math.PI*f)];
function gauge(id,l,u,max,z){let zp="";if(z){const a=gp(z[0]/max),b=gp(Math.min(1,z[1]/max));zp=`<path class="gz" d="M${a[0]} ${a[1]}A50 50 0 0 1 ${b[0]} ${b[1]}"/>`}return `<div class="gg"><svg viewBox="0 0 120 76"><path class="gt" d="M10 64A50 50 0 0 1 110 64"/><path class="gk" d="M4 64A56 56 0 0 1 116 64"/>${zp}<line id="${id}n" x1="60" y1="64" x2="60" y2="24" class="gn" transform="rotate(-90 60 64)"/><circle cx="60" cy="64" r="3.5" class="gc"/></svg><div class="gv"><span id="${id}v">0</span> ${u}</div><div class="gl">${l}</div></div>`}
function setG(id,v,max,z){const n=$(id+"n");if(!n)return;n.setAttribute("transform",`rotate(${-90+180*Math.max(0,Math.min(1,v/max))} 60 64)`);const e=$(id+"v");e.textContent=Math.round(v*10)/10;if(z)e.style.color=(v>=z[0]&&v<=z[1])?"var(--ok)":"var(--ink)"}
const lrn=(h,st,an,w)=>`<div class="learn"><b>${h}</b><ol>${st.map(s=>`<li>${s}</li>`).join("")}</ol><p class="mu"><i>Analogy:</i> ${an}</p>${w.map(x=>`<span class="tag">${x}</span>`).join("")}</div>`;
function go(n){G.step=n;G.run=0;G.end=0;G.hl=-1;window.onPick=null;$("prog").innerHTML=NAMES.map((x,i)=>`<i class="${i<=n?"on":""}"></i>`).join("");[s1,s2,s3,s4,s5,fin][n]()}
function finish(s,res,lr){G.sc[G.step]=s;sfx(s>=70?"ok":"bad");const last=G.step==4;M(`Step ${G.step+1} of 5 complete · ${NAMES[G.step]}`,`${gauge("ms","Step score","/ 100",100,[70,100])}${res}${lr}`,[[last?"View final report":"Continue",()=>go(G.step+1),1]]);setG("ms",s,100,[70,100])}
function intro(){M("Welcome",`<h3>Chemical Mechanical Polishing</h3><p class="br">Deposited chip layers are not flat. CMP planarizes them so the next layer can be patterned accurately. Complete five tasks on the polisher; an explanation follows each one.</p><p class="mu">1 Equipment · 2 Slurry · 3 Recipe · 4 Planarization · 5 Cleaning</p>`,[["Begin",()=>go(0),1]])}
/* 1 */
function s1(){const P=[[0,"Carrier head","Grips the wafer face-down by vacuum and applies backside downforce while rotating."],[1,"Polishing pad","Micro-porous polyurethane (e.g. IC1000) or felt (Suba IV) that carries slurry and transmits shear stress."],[2,"Pad conditioner","Diamond-grit disc that continuously dresses pad asperities to prevent glazing."],[3,"Platen","SiC/aluminium plate with internal cooling-water channels that regulate reaction heat."]];let i=0;G.lab=[0,0,0,0];
const dr=m=>M("Step 1 of 5 · Equipment overview",`<div class="gl">Components identified ${i} / 4</div><div class="bar"><b style="width:${i*25}%"></b></div><p>${m}</p>`,[],1);
G.hl=0;dr("Select the highlighted component in the 3D view. Drag to rotate the machine.");
window.onPick=k=>{if(k!==P[i][0]){dr("Incorrect component. Select the highlighted one.");return}sfx("ok");G.lab[k]=1;const p=P[i];i++;if(i<4){G.hl=P[i][0];dr(`<b>${p[1]}.</b> ${p[2]}<br><span class="mu">Next: select the highlighted component.</span>`)}else{window.onPick=null;G.hl=-1;finish(100,"<p>All four subsystems identified.</p>",lrn("Process explanation",["The <b>carrier head</b> holds the wafer face-down by vacuum and sets the downforce.","The <b>pad</b> carries slurry and transmits shear stress to the wafer.","The <b>conditioner</b> dresses the pad so removal stays stable.","The <b>platen</b> rotates the pad and removes reaction heat through cooling channels."],"Sanding a table: the hand is the carrier, the sandpaper is the pad, and brushing off dust keeps the paper effective.",["CMP","carrier","pad","conditioner","platen"]))}}}
/* 2 */
function s2(){M("Step 2 of 5 · Slurry formulation",`<p class="br">Slurry combines chemistry (softens the film) with abrasive particles (remove it). Adjust both until removal index enters the green band.</p><div class="gs">${gauge("a","Chemical activity","%",100,[40,70])}${gauge("b","Abrasive loading","%",100,[40,70])}${gauge("r","Removal index","%",100,[40,70])}</div><div class="row"><label>Chemical</label><input id="a1" type="range" min="0" max="100" value="20"></div><div class="row"><label>Abrasive</label><input id="a2" type="range" min="0" max="100" value="20"></div><p><b>Status:</b> <span id="ts"></span></p>`,[["Dispense slurry",()=>finish(100,"<p>Slurry formulation within the optimal window.</p>",lrn("Process explanation",["<b>Chemistry</b> softens the surface film (for oxide, an alkaline mix around pH 10 to 11).","<b>Abrasive particles</b> (silica or ceria) mechanically remove the softened layer.","Fab delivery path: blending unit, agitated day tank, pressurized loop with global filters (&gt;10 &micro;m), then point-of-use filters (&lt;1 &micro;m) that capture oversized agglomerates."],"Washing a greasy pan: detergent loosens the grease, the scrubber lifts it. Neither works as well alone.",["slurry","abrasive","pH","day tank","POU filter"])),1,"dp"]]);
const u=()=>{const c=+$("a1").value,g=+$("a2").value,ok=c>=40&&c<=70&&g>=40&&g<=70;setG("a",c,100,[40,70]);setG("b",g,100,[40,70]);setG("r",Math.min(c,g),100,[40,70]);$("ts").textContent=ok?"Optimal: softened film is removed uniformly.":c<40&&g<40?"Both inputs too low: negligible removal.":c<40?"Insufficient chemical action: abrasive alone scratches.":g<40?"Insufficient abrasive: softened layer is not removed.":c>70?"Chemistry too aggressive: risk of attacking other films.":"Abrasive loading too high: scratch risk.";$("dp").disabled=!ok};$("a1").oninput=$("a2").oninput=u;u()}
/* 3 */
function s3(){const PH=[["Pre-Load","5 s",[.5,2],[0,5],[150,300],"Static touchdown and slurry pre-wetting.","A light touchdown on a wetted pad prevents dry scraping of the wafer."],["Ramp-Up","5 s",[8,12],[20,30],[150,300],"Dynamic ramp of force and speed.","Gradual ramping avoids thermal shock to the wafer and pad."],["Main Polish","60-120 s",[5,18],[20,100],[150,300],"Main chemo-mechanical planarization.","Removal rate scales with pressure and velocity (Preston relation)."]],R=[["P","Downforce","psi",20,.5],["V","Platen speed","rpm",120,1],["F","Slurry flow","mL/min",400,10]];let p=0;G.P=G.V=G.F=0;
const dr=()=>{const h=PH[p];M(`Step 3 of 5 · Process recipe · Phase ${p+1} of 3`,`<p class="br"><b>${h[0]}</b> (${h[1]}): ${h[5]} Set each parameter inside its green band.</p><div class="gs">${R.map((r,k)=>gauge("s"+k,r[1],r[2],r[3],h[2+k])).join("")}</div>${R.map(r=>`<div class="row"><label>${r[1]}</label><input id="${r[0]}" type="range" min="0" max="${r[3]}" step="${r[4]}" value="${G[r[0]]}"></div>`).join("")}<p id="hn" class="mu"></p><div id="cards"></div>`,[["Lock "+h[0],lock,1,"lk"]]);
const chk=()=>{let ok=0,m=[];R.forEach((r,k)=>{const b=h[2+k],v=G[r[0]];setG("s"+k,v,r[3],b);if(v>=b[0]&&v<=b[1])ok++;else m.push(`${r[1]}: ${v<b[0]?"increase":"decrease"}`)});$("hn").textContent=ok==3?"All parameters within specification.":m.join("  |  ");$("lk").disabled=ok<3};
R.forEach((r,k)=>{const i=$(r[0]),b=h[2+k],m=r[3];i.style.background=`linear-gradient(90deg,transparent ${b[0]/m*100}%,#34d39966 ${b[0]/m*100}%,#34d39966 ${b[1]/m*100}%,transparent ${b[1]/m*100}%)`;i.oninput=()=>{G[r[0]]=+i.value;chk()}});chk()};
const lock=()=>{const h=PH[p];sfx("ok");if(p<2){M(`Step 3 of 5 · ${h[0]} locked`,`<div class="learn"><b>${h[0]}</b><p>${h[6]}</p></div>`,[["Next phase",()=>{p++;dr()},1]])}else finish(100,"<p>All three recipe phases configured within specification.</p>",lrn("Process explanation",["<b>Pre-Load</b>: touch down gently and pre-wet the pad.","<b>Ramp-Up</b>: raise force and speed gradually to avoid thermal shock.","<b>Main Polish</b>: about 5 to 18 psi, 20 to 100 rpm and 150 to 300 mL/min of slurry for 60 to 120 s."],"Driving: release the brake, accelerate smoothly, then hold cruising speed.",["SOP recipe","downforce","rpm","Preston relation"]))};dr()}
/* 4 */
function xs(){const g=$("c").getContext("2d"),y0=66,k=.6;g.clearRect(0,0,640,130);for(let x=0;x<640;x+=4){const p=x%220<120,h=(p?G.hu:G.hd)*k;g.fillStyle="#475569";g.fillRect(x,y0+14,4,50);if(p){g.fillStyle="#7aa7d6";g.fillRect(x,y0-Math.max(0,h),4,Math.max(0,h));const t=Math.max(0,-h);g.fillStyle="#1e293b";g.fillRect(x,y0+t,4,13-t)}else{g.fillStyle="#7aa7d6";g.fillRect(x,y0-h,4,50+h)}}g.fillStyle="#9aa4b2";g.fillRect(0,y0-Math.max(G.hu,G.hd)*k-9,640,6)}
function s4(){Object.assign(G,{hu:100,hd:40,end:0,P:10,V:60,F:200,sf:1,run:0,fr:40});
M("Step 4 of 5 · Planarization and endpoint",`<canvas id="c" class="cs" width="640" height="130"></canvas><div class="lg"><i style="background:#7aa7d6"></i>Oxide<i style="background:#1e293b"></i>Nitride stop layer<i style="background:#475569"></i>Silicon</div><div class="gs">${gauge("g1","Removal rate","u/s",20,[6,14])}${gauge("g2","Film above stop layer","nm",500,[0,40])}${gauge("g3","Motor current","%",100,[65,100])}</div><p id="hn" class="mu">Press and hold Polish. Release when film thickness enters the green band. Cooling and conditioning are automatic.</p><button class="b p hold" id="hd">Hold to polish</button>`,[["Reset wafer",()=>s4()],["Check wafer",chk4,1,"ck"]],1);xs();let last,fin=0;
const upd=r=>{G.fr+=((G.hu<=1?78:40)-G.fr)*.15+(r?(Math.random()-.5)*3:0);setG("g1",r,20,[6,14]);setG("g2",Math.max(0,G.hu*5),500,[0,40]);setG("g3",G.fr,100,[65,100])};upd(0);
const lp=n=>{if(!G.run)return;const dt=Math.min(.05,(n-last)/1000)*2;last=n;const r=rate(),k=1-.9*Math.min(1,Math.max(0,G.hu-G.hd)/30);G.hu-=r*dt*(G.hu<=0?.12:1);G.hd-=r*dt*k*(G.hu<=0?.6:1);upd(r);$("hn").textContent=G.hu>8?"Polishing: film above stop layer "+Math.round(G.hu*5)+" nm":Math.abs(G.hu)<=6?"Target reached: release now":"Over-polishing";if(G.hu<=1&&!G.end){G.end=1;sfx("ding");toast("Endpoint detected: release now")}xs();if(G.hu<-22){G.run=0;return}requestAnimationFrame(lp)};
const h=$("hd");h.oncontextmenu=e=>e.preventDefault();h.onpointerdown=e=>{if(fin)return;e.preventDefault();G.run=1;last=performance.now();requestAnimationFrame(lp)};h.onpointerup=h.onpointerleave=h.onpointercancel=()=>{G.run=0;upd(0)};
function chk4(){if(G.hu>=99)return toast("Polish the wafer first");fin=1;G.run=0;const hu=G.hu,hd=G.hd;let s,m;if(hu>8){s=60;m="Under-polished: residual oxide remains above the stop layer (risk of electrical shorts). Reset the wafer to retry."}else if(hu<-8||hd<-12){s=70;m="Over-polished: the stop layer was thinned and the trenches show dishing. Reset the wafer to retry."}else if(hu-hd>6){s=80;m="Nearly planar: a small residual step height remains."}else{s=100;m="Planar surface achieved with the process stopped at the stop layer."}
finish(s,`<p>${m}</p>`,lrn("Process explanation",["Raised features contact the pad first, so they are removed faster than recesses: this is <b>planarization</b>.","The hard nitride layer is removed much more slowly, so it acts as a <b>stop layer</b> (high selectivity).","The <b>endpoint</b> is detected from a change in motor current or an optical signal.","Stopping early leaves film behind; stopping late causes <b>dishing</b> and thins the stop layer.","Platen <b>cooling water</b> removes reaction heat; the diamond <b>conditioner</b> prevents pad glazing."],"Sanding a bumpy painted wall until the plaster just shows, then stopping.",["planarization","stop layer","selectivity","endpoint","dishing"]))}}
/* 5 */
function s5(){M("Step 5 of 5 · Post-CMP cleaning",`<p class="br">Slurry residue (red) remains on the wafer. Drag across it to scrub with the PVA brush until the particle count enters the green band, then run metrology.</p><canvas id="w" width="360" height="360" style="width:100%;max-width:260px;display:block;margin:auto;touch-action:none;cursor:none"></canvas><div class="gs" style="grid-template-columns:1fr 1fr">${gauge("p1","Residual particles","count",240,[0,12])}${gauge("p2","Cleaning progress","%",100,[95,100])}</div>`,[["Run metrology",()=>run(),1,"mt"]]);$("mt").disabled=1;
const c=$("w"),g=c.getContext("2d");let P=[],bx=-99,by=-99,t0=0,sy=-1,fn=0;while(P.length<240){const x=Math.random()*360,y=Math.random()*360;if(Math.hypot(x-180,y-180)<165)P.push({x,y,r:2+Math.random()*3})}const N=P.length;setG("p1",N,240,[0,12]);
(function d(){if(!c.isConnected)return;g.clearRect(0,0,360,360);g.save();g.beginPath();g.arc(180,180,170,0,7);g.clip();g.fillStyle="#2a3a52";g.fillRect(0,0,360,360);g.strokeStyle="#5b7aa655";for(let i=10;i<360;i+=24){g.beginPath();g.moveTo(i,0);g.lineTo(i,360);g.moveTo(0,i);g.lineTo(360,i);g.stroke()}g.fillStyle="#ef4444";P.forEach(p=>{g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});if(sy>=0){g.fillStyle="#38bdf8";g.fillRect(0,sy-1,360,2)}g.restore();g.fillStyle="#e2e8f0aa";g.beginPath();g.arc(bx,by,26,0,7);g.fill();requestAnimationFrame(d)})();
const mv=e=>{const r=c.getBoundingClientRect(),k=360/r.width;bx=(e.clientX-r.left)*k;by=(e.clientY-r.top)*k;if(!(e.buttons||e.pointerType=="touch")||fn)return;if(!t0)t0=Date.now();const b=P.length;P=P.filter(p=>Math.hypot(p.x-bx,p.y-by)>30);if(b-P.length>2)sfx("pop");setG("p1",P.length,240,[0,12]);setG("p2",(N-P.length)/N*100,100,[95,100]);if(P.length<=N*.05){fn=1;P=[];setG("p1",0,240,[0,12]);setG("p2",100,100,[95,100]);$("mt").disabled=0;toast("Wafer clean: run metrology")}};c.onpointermove=mv;c.onpointerdown=mv;
